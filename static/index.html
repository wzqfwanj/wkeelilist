<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>wkeeli · 在线服务</title>
  <link rel="stylesheet" href="static/style.css?v=4" />
</head>
<body>
  <main>
    <header class="head">
      <div>
        <h1>wkeeli <span class="dim">/ 在线服务</span></h1>
        <p class="sub">服务器上运行的公网服务 · <span id="summary">加载中…</span></p>
      </div>
      <div class="theme-switch" role="group" aria-label="主题">
        <button type="button" data-theme-value="light" aria-pressed="false">明</button>
        <button type="button" data-theme-value="gray" aria-pressed="false">灰</button>
        <button type="button" data-theme-value="dark" aria-pressed="false">暗</button>
      </div>
    </header>

    <div class="layout">
      <div class="content">
        <div id="list"></div>
      </div>

      <aside class="host">
        <h2>服务器</h2>
        <div id="host-list"></div>
      </aside>
    </div>

    <footer>
      <span id="checked">—</span>
      <noscript>需要启用 JavaScript 才能查看实时状态。</noscript>
    </footer>
  </main>

  <script src="static/app.js?v=4"></script>
</body>
</html>
